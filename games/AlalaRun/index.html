<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ʻAlalā Run, a pixel-art Hawaiian forest runner.">
  <title>ʻAlalā Run</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Courier New", Courier, monospace;
      background: #071b16;
      color: #fff8d2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 1040px;
      min-height: 650px;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: auto;
      background:
        linear-gradient(rgba(5, 25, 19, 0.92), rgba(3, 15, 12, 0.98)),
        repeating-linear-gradient(45deg, #123a2c 0 12px, #0d3025 12px 24px);
    }

    button {
      font: 700 20px/1 "Courier New", Courier, monospace;
    }

    .game-shell {
      width: 976px;
    }

    .stage {
      position: relative;
      box-sizing: content-box;
      width: 960px;
      height: 540px;
      overflow: hidden;
      border: 8px solid #06130f;
      outline: 4px solid #286443;
      background: #75b99b;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }

    canvas {
      display: block;
      width: 960px;
      height: 540px;
      background: #75b99b;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .main-action {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 30px;
      min-width: 190px;
      padding: 14px 24px;
      border: 4px solid #fff4b0;
      color: #10251a;
      background: #f0ba45;
      box-shadow: 6px 6px 0 #153f2a;
      transform: translateX(-50%);
      cursor: pointer;
    }

    .main-action:hover,
    .main-action:focus-visible {
      color: #fffbea;
      background: #c75936;
      outline: 3px solid #fffbea;
      outline-offset: 3px;
    }

    .main-action:active {
      box-shadow: 2px 2px 0 #153f2a;
      transform: translate(-50%, 4px);
    }

    .utility {
      position: absolute;
      z-index: 5;
      top: 12px;
      padding: 8px 10px;
      border: 3px solid #fff4b0;
      color: #fff8d2;
      background: rgba(5, 24, 18, 0.82);
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
      cursor: pointer;
      font-size: 14px;
    }

    .utility:hover,
    .utility:focus-visible {
      background: #286443;
      outline: 2px solid #fffbea;
      outline-offset: 2px;
    }

    #pauseButton {
      left: 12px;
    }

    #soundButton {
      right: 12px;
    }

    .instructions {
      margin: 22px 0 0;
      color: #d3e8c3;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    kbd {
      display: inline-block;
      min-width: 54px;
      margin: 0 4px;
      padding: 5px 8px;
      border: 2px solid #f0d38a;
      border-bottom-width: 5px;
      color: #fff8d2;
      background: #143d2d;
      font: inherit;
    }

    .hidden {
      display: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-labelledby="gameTitle">
    <h1 id="gameTitle" class="sr-only">ʻAlalā Run</h1>
    <div class="stage">
      <canvas
        id="gameCanvas"
        width="480"
        height="270"
        aria-label="ʻAlalā Run game. Guide a stick-carrying Hawaiian crow through a forest."
      >Your browser does not support the canvas element required by ʻAlalā Run.</canvas>
      <button id="mainAction" class="main-action" type="button">Start run</button>
      <button id="pauseButton" class="utility hidden" type="button" aria-label="Pause game">Pause</button>
      <button id="soundButton" class="utility" type="button" aria-pressed="false">Sound: on</button>
      <p id="gameStatus" class="sr-only" aria-live="polite">Title screen</p>
    </div>
    <p id="instructions" class="instructions">
      <kbd>Space</kbd> jump / flap &nbsp;&nbsp; <kbd>Shift</kbd> duck &nbsp;&nbsp; Survive 60 seconds
    </p>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const mainAction = document.getElementById("mainAction");
      const pauseButton = document.getElementById("pauseButton");
      const soundButton = document.getElementById("soundButton");
      const gameStatus = document.getElementById("gameStatus");
      const instructions = document.getElementById("instructions");

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const GROUND_Y = 226;
      const STEP = 1 / 120;
      const WIN_TIME = 60;
      const GRAVITY = 1020;
      const JUMP_VELOCITY = -355;
      const FLAP_VELOCITY = -260;
      const STATE = Object.freeze({
        TITLE: "title",
        PLAYING: "playing",
        PAUSED: "paused",
        LOST: "lost",
        WON: "won"
      });

      const COLORS = Object.freeze({
        ink: "#101815",
        crow: "#151b1d",
        crowLight: "#34454e",
        beak: "#2f3431",
        cream: "#fff4bd",
        gold: "#efb73e",
        orange: "#c85d34",
        greenDark: "#16472e",
        green: "#2f7546",
        greenLight: "#6ea755",
        sky: "#8fc5ac",
        red: "#dd4b3e",
        wood: "#75502f",
        woodLight: "#a8793e"
      });

      const GLYPHS = Object.freeze({
        "A": ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
        "D": ["11110", "10001", "10001", "10001", "10001", "10001", "11110"],
        "E": ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
        "H": ["10001", "10001", "10001", "11111", "10001", "10001", "10001"],
        "L": ["10000", "10000", "10000", "10000", "10000", "10000", "11111"],
        "M": ["10001", "11011", "10101", "10101", "10001", "10001", "10001"],
        "O": ["01110", "10001", "10001", "10001", "10001", "10001", "01110"],
        "P": ["11110", "10001", "10001", "11110", "10000", "10000", "10000"],
        "R": ["11110", "10001", "10001", "11110", "10100", "10010", "10001"],
        "S": ["01111", "10000", "10000", "01110", "00001", "00001", "11110"],
        "U": ["10001", "10001", "10001", "10001", "10001", "10001", "01110"],
        "N": ["10001", "11001", "11001", "10101", "10011", "10011", "10001"],
        "a": ["01110", "00001", "01111", "10001", "10011", "01101", "00000"],
        "l": ["110", "010", "010", "010", "010", "010", "111"],
        "n": ["00000", "00000", "11110", "10001", "10001", "10001", "10001"],
        "u": ["00000", "00000", "10001", "10001", "10001", "10011", "01101"],
        "ʻ": ["011", "110", "100", "000", "000", "000", "000"],
        " ": ["000", "000", "000", "000", "000", "000", "000"]
      });

      const player = {
        x: 68,
        feetY: GROUND_Y,
        vy: 0,
        grounded: true,
        flapAvailable: true,
        ducking: false,
        flapTimer: 0,
        runTimer: 0
      };

      let state = STATE.TITLE;
      let stateBeforePause = STATE.PLAYING;
      let obstacles = [];
      let elapsed = 0;
      let distance = 0;
      let speed = 145;
      let distanceSinceSpawn = 0;
      let nextSpawnGap = 245;
      let lastArrivalAt = 0;
      let lastObstacleAction = null;
      let backgroundBirds = [];
      let winAnimationStart = 0;
      let lastTime = performance.now();
      let accumulator = 0;
      let shiftHeld = false;
      let muted = false;
      let audioContext = null;

      ctx.imageSmoothingEnabled = false;

      function setStatus(message) {
        gameStatus.textContent = message;
      }

      function setState(nextState) {
        state = nextState;
        mainAction.classList.toggle("hidden", nextState === STATE.PLAYING);
        pauseButton.classList.toggle(
          "hidden",
          nextState !== STATE.PLAYING && nextState !== STATE.PAUSED
        );
        soundButton.classList.toggle("hidden", nextState === STATE.LOST);
        instructions.classList.toggle("hidden", nextState === STATE.LOST);

        if (nextState === STATE.TITLE) {
          mainAction.textContent = "Start run";
          setStatus("Title screen. Press Start run or Enter to begin.");
        } else if (nextState === STATE.PLAYING) {
          pauseButton.textContent = "Pause";
          pauseButton.setAttribute("aria-label", "Pause game");
          setStatus("Run started.");
        } else if (nextState === STATE.PAUSED) {
          mainAction.textContent = "Resume";
          pauseButton.textContent = "Resume";
          pauseButton.setAttribute("aria-label", "Resume game");
          setStatus("Game paused.");
        } else if (nextState === STATE.LOST) {
          mainAction.textContent = "Hana hou!";
          setStatus(`${Math.floor(elapsed)} seconds. Hana hou!`);
        } else if (nextState === STATE.WON) {
          mainAction.textContent = "Run again";
          setStatus("You made it home. The run is complete.");
        }
      }

      function resetPlayer() {
        player.feetY = GROUND_Y;
        player.vy = 0;
        player.grounded = true;
        player.flapAvailable = true;
        player.ducking = false;
        player.flapTimer = 0;
        player.runTimer = 0;
      }

      function startGame() {
        unlockAudio();
        elapsed = 0;
        distance = 0;
        speed = 145;
        distanceSinceSpawn = 0;
        nextSpawnGap = 135;
        lastArrivalAt = 0;
        lastObstacleAction = null;
        backgroundBirds = createBackgroundBirds();
        obstacles = [];
        shiftHeld = false;
        accumulator = 0;
        resetPlayer();
        setState(STATE.PLAYING);
        sound("start");
      }

      function loseGame() {
        player.ducking = false;
        shiftHeld = false;
        setState(STATE.LOST);
        sound("hit");
        mainAction.focus({ preventScroll: true });
      }

      function winGame() {
        elapsed = WIN_TIME;
        winAnimationStart = performance.now() / 1000;
        player.ducking = false;
        shiftHeld = false;
        setState(STATE.WON);
        sound("win");
        mainAction.focus({ preventScroll: true });
      }

      function togglePause() {
        if (state === STATE.PLAYING) {
          stateBeforePause = state;
          shiftHeld = false;
          player.ducking = false;
          setState(STATE.PAUSED);
          mainAction.focus({ preventScroll: true });
        } else if (state === STATE.PAUSED && stateBeforePause === STATE.PLAYING) {
          accumulator = 0;
          lastTime = performance.now();
          setState(STATE.PLAYING);
          canvas.focus({ preventScroll: true });
        }
      }

      function primaryAction() {
        if (state === STATE.TITLE || state === STATE.LOST || state === STATE.WON) {
          startGame();
        } else if (state === STATE.PAUSED) {
          togglePause();
        }
      }

      function jumpOrFlap() {
        if (state !== STATE.PLAYING) return;

        unlockAudio();
        if (player.grounded) {
          player.grounded = false;
          player.vy = JUMP_VELOCITY;
          player.flapAvailable = true;
          player.flapTimer = 0.2;
          sound("flap");
        } else if (player.flapAvailable) {
          player.vy = Math.min(player.vy, FLAP_VELOCITY);
          player.flapAvailable = false;
          player.flapTimer = 0.24;
          sound("flap");
        }
      }

      function update(dt) {
        elapsed += dt;
        if (elapsed >= WIN_TIME) {
          winGame();
          return;
        }

        const progress = elapsed / WIN_TIME;
        speed = 145 + 78 * progress;
        distance += speed * dt;
        updateBackgroundBirds(dt);
        player.runTimer += dt;
        player.flapTimer = Math.max(0, player.flapTimer - dt);
        player.ducking = player.grounded && shiftHeld;

        if (!player.grounded) {
          player.vy += GRAVITY * dt;
          player.feetY += player.vy * dt;
          if (player.feetY >= GROUND_Y) {
            player.feetY = GROUND_Y;
            player.vy = 0;
            player.grounded = true;
            player.flapAvailable = true;
          }
        }

        distanceSinceSpawn += speed * dt;
        if (distanceSinceSpawn >= nextSpawnGap) {
          spawnObstacle();
          distanceSinceSpawn = 0;
          nextSpawnGap = speed * (0.5 + Math.random() * 0.25) + 40;
        }

        for (const obstacle of obstacles) {
          obstacle.age += dt;
          obstacle.y = obstacle.baseY;
          if (obstacle.type === "hawk") {
            obstacle.y += Math.round(Math.sin(obstacle.age * 5 + obstacle.phase) * 2);
          }
          if (obstacle.delay > 0) {
            obstacle.delay = Math.max(0, obstacle.delay - dt);
          } else {
            obstacle.x += obstacle.direction * speed * obstacle.speedFactor * dt;
          }
        }
        obstacles = obstacles.filter((obstacle) => {
          if (obstacle.direction < 0) return obstacle.x + obstacle.w > -20;
          return obstacle.x < WIDTH + 20;
        });

        const playerBox = getPlayerHitbox();
        for (const obstacle of obstacles) {
          if (obstacle.delay > 0) continue;
          if (intersects(playerBox, getObstacleHitbox(obstacle))) {
            loseGame();
            return;
          }
        }
      }

      function spawnObstacle() {
        const choices = ["ohia", "koa"];
        if (elapsed >= 8) choices.push("pig");
        if (elapsed >= 14) choices.push("hawk");

        let type = choices[Math.floor(Math.random() * choices.length)];
        if (type === "koa" && Math.random() < 2 / 3) {
          const alternatives = choices.filter((choice) => choice !== "koa");
          type = alternatives[Math.floor(Math.random() * alternatives.length)];
        }
        const definitions = {
          ohia: { w: 40, h: 49, y: GROUND_Y - 49 },
          koa: { w: 36, h: 43, y: GROUND_Y - 43 },
          pig: { w: 50, h: 31, y: GROUND_Y - 31 },
          hawk: { w: 49, h: 26, y: 188 }
        };
        const definition = definitions[type];
        const direction = type === "hawk" && Math.random() < 0.5 ? 1 : -1;
        const hawkLanes = [145, 169, 188];
        const baseY = type === "hawk"
          ? hawkLanes[Math.floor(Math.random() * hawkLanes.length)]
          : definition.y;
        const speedFactor = type === "hawk" ? 0.92 + Math.random() * 0.2 : 1;
        const startX = direction < 0 ? WIDTH + 16 : -definition.w - 18;
        const travelDistance = direction < 0
          ? startX - player.x
          : player.x - startX;
        const travelTime = travelDistance / (speed * speedFactor);
        const action = type === "hawk"
          ? baseY >= 184 ? "duck" : "air"
          : "jump";
        const actionGap = getActionGap(lastObstacleAction, action);
        const earliestArrival = elapsed + travelTime + (direction > 0 ? 0.75 : 0);
        const arrivalAt = Math.max(earliestArrival, lastArrivalAt + actionGap);
        const obstacle = {
          type,
          x: startX,
          y: baseY,
          baseY,
          w: definition.w,
          h: definition.h,
          age: 0,
          phase: Math.random() * Math.PI * 2,
          direction,
          speedFactor,
          delay: Math.max(0, arrivalAt - elapsed - travelTime),
          variant: Math.random() < 0.45 ? "light" : "dark"
        };

        obstacles.push(obstacle);
        lastArrivalAt = arrivalAt;
        lastObstacleAction = action;
      }

      function getActionGap(previous, next) {
        if (!previous) return 0;
        if (previous === "jump" || next === "jump") return 0.92;
        if (previous === "duck" && next === "duck") return 0.68;
        return 0.74;
      }

      function getPlayerHitbox() {
        if (player.ducking) {
          return { x: player.x + 5, y: player.feetY - 15, w: 27, h: 12 };
        }
        return { x: player.x + 5, y: player.feetY - 24, w: 23, h: 21 };
      }

      function getObstacleHitbox(obstacle) {
        if (obstacle.type === "hawk") {
          return { x: obstacle.x + 7, y: obstacle.y + 6, w: 35, h: 12 };
        }
        if (obstacle.type === "pig") {
          return { x: obstacle.x + 5, y: obstacle.y + 6, w: 40, h: 24 };
        }
        if (obstacle.type === "koa") {
          return { x: obstacle.x + 5, y: obstacle.y + 6, w: 26, h: 37 };
        }
        return { x: obstacle.x + 6, y: obstacle.y + 5, w: 28, h: 44 };
      }

      function intersects(a, b) {
        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }

      function render(time) {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        if (state === STATE.TITLE) {
          drawTitleScreen(time);
          return;
        }
        if (state === STATE.WON) {
          drawWinScreen(time);
          return;
        }

        drawWorld(time);
        drawObstacles();
        drawPlayer();
        drawHud();

        if (state === STATE.PAUSED) drawPauseOverlay();
        if (state === STATE.LOST) drawLoseOverlay();
      }

      function drawWorld(time) {
        ctx.fillStyle = COLORS.sky;
        ctx.fillRect(0, 0, WIDTH, GROUND_Y);

        ctx.fillStyle = "#c4d7a3";
        ctx.fillRect(0, 57, WIDTH, 46);
        drawCloud(42 - (distance * 0.04) % 550, 34);
        drawCloud(280 - (distance * 0.025) % 620, 54);

        ctx.fillStyle = "#51875b";
        for (let i = -1; i < 8; i += 1) {
          const x = Math.floor(i * 84 - (distance * 0.11) % 84);
          drawDistantTree(x, 95 + ((i + 8) % 2) * 9);
        }

        drawForestBirds();

        ctx.fillStyle = "#2e6944";
        ctx.fillRect(0, 171, WIDTH, 55);
        for (let i = -1; i < 11; i += 1) {
          const x = Math.floor(i * 52 - (distance * 0.23) % 52);
          drawShrub(x, 162 + ((i + 11) % 3) * 5);
        }

        ctx.fillStyle = "#714e30";
        ctx.fillRect(0, GROUND_Y, WIDTH, HEIGHT - GROUND_Y);
        ctx.fillStyle = "#396d3b";
        ctx.fillRect(0, GROUND_Y, WIDTH, 5);
        ctx.fillStyle = "#95673a";
        for (let x = -20; x < WIDTH + 20; x += 28) {
          const offset = Math.floor(distance % 28);
          ctx.fillRect(x - offset, 239 + ((x / 28) & 1) * 10, 8, 3);
        }

        const light = 0.5 + Math.sin(time * 0.6) * 0.04;
        ctx.fillStyle = `rgba(255, 244, 184, ${light * 0.1})`;
        ctx.fillRect(0, 0, WIDTH, 2);
      }

      function drawCloud(x, y) {
        ctx.fillStyle = "#e9e3bd";
        ctx.fillRect(Math.floor(x), y + 5, 42, 7);
        ctx.fillRect(Math.floor(x) + 8, y, 19, 12);
        ctx.fillRect(Math.floor(x) + 25, y + 3, 12, 8);
      }

      function drawDistantTree(x, y) {
        ctx.fillStyle = "#315f42";
        ctx.fillRect(x + 17, y + 31, 6, 49);
        ctx.fillStyle = "#51875b";
        ctx.fillRect(x + 4, y + 14, 34, 24);
        ctx.fillRect(x + 11, y + 3, 23, 40);
        ctx.fillRect(x, y + 22, 44, 12);
      }

      function drawShrub(x, y) {
        ctx.fillStyle = "#245c39";
        ctx.fillRect(x, y + 13, 47, 30);
        ctx.fillRect(x + 8, y + 5, 31, 37);
        ctx.fillStyle = "#4e8a4b";
        ctx.fillRect(x + 4, y + 12, 13, 8);
        ctx.fillRect(x + 25, y + 7, 16, 9);
      }

      function createBackgroundBirds() {
        return [
          { species: "pueo", x: 425, baseY: 42, y: 42, scale: 1.05, direction: -1, speed: 10, phase: 0.4, age: 0, alpha: 0.58 },
          { species: "iiwi", x: 105, baseY: 71, y: 71, scale: 0.9, direction: 1, speed: 14, phase: 1.7, age: 0, alpha: 0.78 },
          { species: "amakihi", x: 285, baseY: 88, y: 88, scale: 0.72, direction: -1, speed: 17, phase: 3.1, age: 0, alpha: 0.7 },
          { species: "palila", x: 36, baseY: 116, y: 116, scale: 0.86, direction: 1, speed: 11, phase: 4.4, age: 0, alpha: 0.72 },
          { species: "elepaio", x: 360, baseY: 147, y: 147, scale: 0.8, direction: -1, speed: 13, phase: 2.5, age: 0, alpha: 0.76 },
          { species: "iiwi", x: 455, baseY: 126, y: 126, scale: 0.68, direction: -1, speed: 21, phase: 5.3, age: 0, alpha: 0.62 },
          { species: "amakihi", x: 160, baseY: 139, y: 139, scale: 0.62, direction: 1, speed: 15, phase: 0.8, age: 0, alpha: 0.64 },
          { species: "palila", x: 255, baseY: 58, y: 58, scale: 0.7, direction: -1, speed: 12, phase: 3.8, age: 0, alpha: 0.59 },
          { species: "elepaio", x: 65, baseY: 153, y: 153, scale: 0.62, direction: 1, speed: 10, phase: 5.8, age: 0, alpha: 0.62 },
          { species: "pueo", x: 205, baseY: 99, y: 99, scale: 0.72, direction: 1, speed: 8, phase: 2.2, age: 0, alpha: 0.48 }
        ];
      }

      function updateBackgroundBirds(dt) {
        for (const bird of backgroundBirds) {
          bird.age += dt;
          bird.x += bird.direction * bird.speed * dt;
          bird.y = bird.baseY + Math.sin(bird.age * 2.6 + bird.phase) * (bird.species === "pueo" ? 2 : 4);

          if (bird.direction < 0 && bird.x < -55) bird.x = WIDTH + 55;
          if (bird.direction > 0 && bird.x > WIDTH + 55) bird.x = -55;
        }
      }

      function drawForestBirds() {
        for (const bird of backgroundBirds) {
          ctx.save();
          ctx.globalAlpha = bird.alpha;
          ctx.translate(Math.round(bird.x), Math.round(bird.y));
          ctx.scale(bird.direction * bird.scale, bird.scale);

          const wingsUp = Math.floor(bird.age * (bird.species === "pueo" ? 4 : 7)) % 2 === 0;
          if (bird.species === "iiwi") drawIiwi(wingsUp);
          if (bird.species === "amakihi") drawAmakihi(wingsUp);
          if (bird.species === "palila") drawPalila(wingsUp);
          if (bird.species === "elepaio") drawElepaio(wingsUp);
          if (bird.species === "pueo") drawPueo(wingsUp);
          ctx.restore();
        }
      }

      function drawIiwi(wingsUp) {
        ctx.fillStyle = "#c9332e";
        ctx.fillRect(-7, -4, 13, 9);
        ctx.fillRect(3, -6, 7, 8);
        ctx.fillStyle = "#202326";
        ctx.fillRect(-12, 1, 7, 4);
        ctx.fillRect(-5, wingsUp ? -9 : -1, 9, 5);
        if (!wingsUp) ctx.fillRect(-2, 3, 8, 4);
        ctx.fillStyle = "#e79463";
        ctx.fillRect(9, -4, 7, 2);
        ctx.fillRect(14, -2, 3, 2);
        ctx.fillStyle = COLORS.cream;
        ctx.fillRect(7, -4, 1, 1);
      }

        const nestX = 300;
        const nestY = 184;
        const landed = cycle >= 2.8;

        ctx.save();

        ctx.scale(1.55, 1.55);

        ctx.fillStyle = "#6b472c";
        ctx.fillRect(-48, -8, 96, 8);

        drawNestCrow(42, -34, -1);
        if (landed) drawNestCrow(-42, -34, 1);

        drawNestEgg(-13, -9, 0);
        drawNestEgg(0, -12, 1);
        drawNestEgg(13, -8, 2);

        ctx.fillStyle = COLORS.wood;

        ctx.fillStyle = COLORS.woodLight;

          ctx.fillRect(11, -8, 3, 7);

        ctx.restore();

        if (!landed) {
          const progress = Math.min(1, cycle / 2.8);
          const eased = progress * progress * (3 - 2 * progress);
          const x = -42 + (252 + 42) * eased;
          const y = 101 + (150 - 101) * eased - Math.sin(progress * Math.PI) * 28;
          drawVictoryFlyingAlala(x, y, cycle, 1.28);

        if (cycle >= 2.9) {
          const heartAlpha = Math.min(1, (cycle - 2.9) * 2.5);

      function drawHeart(cx, cy, scale) {
        const pattern = [
          "0110110",
          "1111111",
          "1111111",
          "0111110",
          "0011100",
          "0001000"
        ];
        ctx.fillStyle = COLORS.red;
        for (let row = 0; row < pattern.length; row += 1) {
          for (let col = 0; col < pattern[row].length; col += 1) {
            if (pattern[row][col] === "1") {
              ctx.fillRect(
                Math.round(cx - (pattern[row].length * scale) / 2 + col * scale),
                Math.round(cy + row * scale),
                scale,
                scale
              );
            }
          }
        }
      }

      function drawPixelText(text, centerX, y, scale, color) {
        const characters = Array.from(text);
        const widths = characters.map((character) => {
          const normalized = character === "Ā" ? "A" : character === "ā" ? "a" : character;
          const glyph = GLYPHS[normalized] || GLYPHS[" "];
          return glyph[0].length + 1;
        });
        const totalWidth = (widths.reduce((sum, width) => sum + width, 0) - 1) * scale;
        let cursorX = Math.round(centerX - totalWidth / 2);

        ctx.fillStyle = color;
        characters.forEach((character, index) => {
          const normalized = character === "Ā" ? "A" : character === "ā" ? "a" : character;
          const glyph = GLYPHS[normalized] || GLYPHS[" "];
          const glyphY = y + 2 * scale;

          if (character === "Ā" || character === "ā") {
            ctx.fillRect(cursorX, y, 5 * scale, scale);
          }

          for (let row = 0; row < glyph.length; row += 1) {
            for (let col = 0; col < glyph[row].length; col += 1) {
              if (glyph[row][col] === "1") {
                ctx.fillRect(cursorX + col * scale, glyphY + row * scale, scale, scale);
              }
            }
          }
          cursorX += widths[index] * scale;
        });
      }

      function unlockAudio() {
        if (muted) return;
        if (!audioContext) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          audioContext = new AudioContext();
        }
        if (audioContext.state === "suspended") audioContext.resume();
      }

      function sound(kind) {
        if (muted || !audioContext) return;
        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const settings = {
          start: [310, 0.08, "square"],
          flap: [210, 0.055, "triangle"],
          hit: [82, 0.2, "sawtooth"],
          win: [520, 0.35, "square"]
        }[kind];
        if (!settings) return;

        oscillator.type = settings[2];
        oscillator.frequency.setValueAtTime(settings[0], now);
        if (kind === "win") oscillator.frequency.linearRampToValueAtTime(780, now + settings[1]);
        if (kind === "hit") oscillator.frequency.exponentialRampToValueAtTime(45, now + settings[1]);
        gain.gain.setValueAtTime(0.045, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + settings[1]);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + settings[1]);
      }

      function toggleSound() {
        muted = !muted;
        soundButton.textContent = muted ? "Sound: off" : "Sound: on";
        soundButton.setAttribute("aria-pressed", String(muted));
        if (!muted) {
          unlockAudio();
          sound("start");
        }
      }

      function onKeyDown(event) {
        if (event.code === "Space") {
          event.preventDefault();
          if (event.repeat) return;
          if (state === STATE.PLAYING) jumpOrFlap();
          else primaryAction();
          return;
        }

        if (event.code === "Enter" && !event.repeat) {
          if (state !== STATE.PLAYING) primaryAction();
          return;
        }

        if (event.code === "ShiftLeft" || event.code === "ShiftRight") {
          if (state === STATE.PLAYING) {
            event.preventDefault();
            shiftHeld = true;
          }
          return;
        }

        if (event.code === "Escape" && !event.repeat) {
          if (state === STATE.PLAYING || state === STATE.PAUSED) togglePause();
        }
      }

      function onKeyUp(event) {
        if (event.code === "ShiftLeft" || event.code === "ShiftRight") {
          shiftHeld = false;
        }
      }

      function frame(now) {
        const delta = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        if (state === STATE.PLAYING) {
          accumulator += delta;
          while (accumulator >= STEP && state === STATE.PLAYING) {
            update(STEP);
            accumulator -= STEP;
          }
        } else {
          accumulator = 0;
        }

        render(now / 1000);
        requestAnimationFrame(frame);
      }

      mainAction.addEventListener("click", primaryAction);
      pauseButton.addEventListener("click", togglePause);
      soundButton.addEventListener("click", toggleSound);
      window.addEventListener("keydown", onKeyDown, { passive: false });
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("blur", () => {
        shiftHeld = false;
        if (state === STATE.PLAYING) togglePause();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === STATE.PLAYING) togglePause();
      });

      setState(STATE.TITLE);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
